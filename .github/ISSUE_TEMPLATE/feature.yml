name: 能力需求
description: 提议任务清单内的新能力或里程碑细化
title: "[Feature] "
labels: [enhancement]
body:
  - type: input
    id: milestone
    attributes:
      label: 里程碑 / 任务编号
      placeholder: 例如 M1-PROVIDER-01
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户目标，不粘贴生产或个人敏感数据。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可复现验收
      description: 写明输入、预期行为、失败态和验证方式。
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 数据与副作用边界
      description: 说明敏感级别、Provider 边界和是否包含外部动作。
    validations:
      required: true
